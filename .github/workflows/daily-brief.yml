name: Daily AI and English briefing

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Replace today's issue even when it is already ready
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub schedules can be delayed or dropped, so use three off-peak retries.
    - cron: "5 23 * * *"  # 07:05 Beijing
    - cron: "25 23 * * *" # 07:25 Beijing
    - cron: "45 23 * * *" # 07:45 Beijing

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Check whether today's issue is already ready
        id: freshness
        run: |
          if [[ "${{ inputs.force_refresh }}" == "true" ]]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node automation/validate-issue.mjs; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and verify today's issue
        if: steps.freshness.outputs.needs_update == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          prompt="$(cat automation/daily-prompt.md)"
          if [[ "${{ inputs.force_refresh }}" == "true" ]]; then
            prompt="$prompt

FORCE REFRESH: Today's issue already exists but is known to be defective. You must materially replace today's english.articles with 2-3 newly researched articles whose titles and URLs have never appeared in any earlier issue. Do not merely change updatedAt. Preserve the other sections when they remain valid."
          fi
          copilot -p "$prompt" \
            --allow-all-tools \
            --allow-all-urls \
            --no-ask-user

      - name: Validate generated data
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          node --check data/issues.js
          node automation/validate-issue.mjs

      - name: Commit update
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          if git diff --quiet -- data/issues.js; then
            echo "No data change was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issues.js
          git commit -m "Update daily briefing $(TZ=Asia/Shanghai date +%F)"
          git push
